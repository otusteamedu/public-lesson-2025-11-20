services:
    php-fpm:
        build: docker
        container_name: 'pl-php-symfony'
        volumes:
            - ./app:/app
        working_dir: /app

    nginx:
        image: nginx
        container_name: 'pl-nginx-symfony'
        working_dir: /app
        depends_on:
            -   php-fpm
        ports:
            - '19999:80'
        volumes:
            - ./app:/app
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
            - ./docker/nginx/logs:/var/log/nginx:delegated

    postgres:
        image: postgres:15
        ports:
            - 25432:5432
        container_name: 'pl-postgresql-symfony'
        working_dir: /app
        restart: always
        environment:
            POSTGRES_DB: 'pl_db'
            POSTGRES_USER: 'pl_db_user'
            POSTGRES_PASSWORD: 'pl_db_password'
        volumes:
            - dump_pl_symfony:/app/dump
            - postgresql_pl_symfony:/var/lib/postgresql/data

    redis:
        container_name: pl-redis
        restart: unless-stopped
        image: redis:alpine

volumes:
    dump_pl_symfony:
    postgresql_pl_symfony:
